<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강원도 춘천시 온의동 뽀모도로</title>
  <link rel="stylesheet" href="index.css" />
  <script defer src="index.js"></script>
</head>

<body>
  <main class="timer-card">
    <h1>Pomodoro</h1>

    <div class="current-time" id="currentTime"></div>

    <div class="time-display" id="timeDisplay">25:00</div>

    <div class="controls">
      <button type="button" class="btn btn-start" onclick="startTimer()">시작</button>
      <button type="button" class="btn btn-stop" onclick="stopTimer()">정지</button>
      <button type="button" class="btn btn-reset" onclick="resetTimer()">초기화</button>
    </div>

    <a href="setting.html" class="btn btn-settings">설정</a>
  </main>

</body>

</html>
