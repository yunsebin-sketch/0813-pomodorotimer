<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setting</title>
  <link rel="stylesheet" href="setting.css" />
  <script defer src="setting.js"></script>
</head>
<body>
  <main class="setting-card">
    <h3>Setting</h3>

    <div class="setting-field">
      <label for="timerMinutes">타이머 시간 (분)</label>
      <input type="number" id="timerMinutes" name="timerMinutes" min="1" max="60" value="25" oninput="updateConfirmState()" />
    </div>

    <button type="button" class="btn btn-confirm" onclick="saveSetting()">설정 완료</button>
  </main>
</body>
</html>
